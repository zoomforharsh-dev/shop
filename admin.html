<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin - Meri Dukan</title><style>*{box-sizing:border-box;font-family:Arial} body{margin:0;background:#111;color:#fff;padding:15px}input{width:100%;padding:12px;margin:7px 0;border-radius:10px;border:0}button{width:100%;padding:12px;border:0;border-radius:10px;font-weight:bold;cursor:pointer}.card{background:#222;padding:12px;border-radius:12px;display:flex;gap:10px;align-items:center;margin-bottom:10px}.card img{width:60px;height:60px;object-fit:cover;border-radius:8px}#preview{width:100%;max-height:200px;object-fit:cover;border-radius:12px;display:none;margin-top:8px}.uploadBox{background:#333;padding:15px;border-radius:12px;text-align:center;border:2px dashed #ff9800;margin:7px 0;cursor:pointer}</style></head><body><h2> Owner Admin Panel</h2><div id="lockBox">  <input type="password" id="pass" placeholder="Admin Password">  <button style="background:#ff9800" onclick="unlock()">Unlock</button>  <p style="color:#aaa;font-size:13px">Password: <b>1234</b></p></div><div id="adminBox" style="display:none">  <input id="pName" placeholder="Product ka Naam">  <!-- FLIPKART WALA DISCOUNT - 2 PRICE -->  <input id="pMrp" type="number" placeholder="MRP - Kata hua Price - Jaise: 999">  <input id="pPrice" type="number" placeholder="Selling Price - Bikne wala Price - Jaise: 499">  <p id="discPreview" style="color:#25D366;font-weight:bold"></p>
  <label class="uploadBox" for="pImgFile"> Yahan Click Karke Phone se Photo Chuno</label>  <input type="file" id="pImgFile" accept="image/*" style="display:none" onchange="previewImg(this)">  <img id="preview">  <input id="pImg" placeholder="Photo ka Link (optional)">  <input id="pDesc" placeholder="Description">  <button style="background:#25D366;color:#fff" onclick="addProduct()">+ Product Add Karo</button>  <br><br><a href="shop.html" style="color:#ff9800">→ Shop Dekho</a>  <h3>Added Products</h3>  <div id="list"></div></div><script>let products = JSON.parse(localStorage.getItem('myShopProducts') || '[]');let selectedImg = '';function unlock(){ if(document.getElementById('pass').value==='1234'){ document.getElementById('lockBox').style.display='none'; document.getElementById('adminBox').style.display='block'; render(); } else alert('Galat Password!'); }function save(){ localStorage.setItem('myShopProducts', JSON.stringify(products)); }function previewImg(input){ let file=input.files[0]; if(!file) return; let reader=new FileReader(); reader.onload=function(e){ selectedImg=e.target.result; let pv=document.getElementById('preview'); pv.src=selectedImg; pv.style.display='block'; }; reader.readAsDataURL(file); }// Discount live dikhane ke liyedocument.getElementById('pMrp').addEventListener('input', calcDisc);document.getElementById('pPrice').addEventListener('input', calcDisc);function calcDisc(){ let mrp=parseInt(document.getElementById('pMrp').value); let pr=parseInt(document.getElementById('pPrice').value); if(mrp && pr && mrp>pr){ let d=Math.round((mrp-pr)/mrp*100); document.getElementById('discPreview').innerText=' Flipkart me aise dikhega: ₹'+pr+' ₹'+mrp+' '+d+'% off'; } else document.getElementById('discPreview').innerText=''; }function addProduct(){  let name=document.getElementById('pName').value.trim();  let mrp=parseInt(document.getElementById('pMrp').value);  let price=parseInt(document.getElementById('pPrice').value);  let img=selectedImg || document.getElementById('pImg').value.trim() || 'https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=400';  let desc=document.getElementById('pDesc').value.trim() || 'Best Quality';  if(!name || !price || !mrp){ alert('Naam, MRP aur Selling Price teeno bharo'); return; }  let discount=Math.round((mrp-price)/mrp*100);  products.push({name,mrp,price,discount,img,desc}); save();  document.getElementById('pName').value=''; document.getElementById('pMrp').value=''; document.getElementById('pPrice').value=''; document.getElementById('pImg').value=''; document.getElementById('pDesc').value=''; document.getElementById('discPreview').innerText=''; selectedImg=''; document.getElementById('preview').style.display='none';  alert('Add Ho Gaya! '+discount+'% off dikhega'); render();}function del(i){ if(confirm('Delete karein?')){ products.splice(i,1); save(); render(); } }function render(){ let h=''; products.forEach((p,i)=>{ h+=`<div class="card"><img src="${p.img}"><div style="flex:1"><b>${p.name}</b><br>₹${p.price} <s style="color:#aaa">₹${p.mrp}</s> <b style="color:#25D366">${p.discount||0}% off</b></div><button style="width:auto;background:red;color:#fff" onclick="del(${i})">Delete</button></div>`; }); document.getElementById('list').innerHTML=h||'Koi product nahi'; }</script></body></html>
