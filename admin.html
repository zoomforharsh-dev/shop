<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meri Dukan</title>
<style>
*{box-sizing:border-box;font-family:Arial} body{margin:0;background:#f5f5f5;padding:15px}
header{display:flex;justify-content:space-between;align-items:center;background:#111;color:#fff;padding:12px 15px;border-radius:12px}
header button{background:#25D366;color:#fff;border:0;padding:10px 16px;border-radius:20px;font-weight:bold;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}
.card{background:#fff;padding:10px;border-radius:12px;text-align:center;position:relative}
.card img{width:100%;height:130px;object-fit:cover;border-radius:10px}
.card button{background:#111;color:#fff;border:0;padding:9px;width:100%;border-radius:8px;margin-top:6px;cursor:pointer}
.badge{position:absolute;top:8px;left:8px;background:#388e3c;color:#fff;padding:4px 8px;border-radius:6px;font-size:12px;font-weight:bold}
.mrp{color:#888;text-decoration:line-through;font-size:13px} .off{color:#388e3c;font-weight:bold;font-size:13px} .price{font-size:18px;font-weight:bold}
#cartBox,#payBox{background:#fff;padding:15px;border-radius:12px;margin-top:15px;display:none}
#payBox{text-align:center;border:2px solid #25D366} #payBox img{width:220px;height:220px;object-fit:contain;border:1px solid #ddd;border-radius:12px}
.payBtn{background:#25D366;color:#fff;border:0;padding:12px;width:100%;border-radius:10px;font-weight:bold;margin-top:10px;cursor:pointer}
</style>
</head>
<body>
<header><b>🛍️ Meri Dukan</b><button onclick="showCart()">🛒 Cart (<span id="cartCount">0</span>)</button></header>
<div class="grid" id="products"></div>
<div id="cartBox"><h3>🛒 Tumhara Cart</h3><div id="cartList"></div><h3>Total: ₹<span id="total">0</span></h3><p id="saving" style="color:#388e3c;font-weight:bold"></p><button class="payBtn" onclick="showPay()">✅ Checkout - QR se Pay Karo</button></div>
<div id="payBox">
<h3>📷 Scan Karke Pay Karo</h3><img src="qr.jpg" alt="Payment QR">
<div style="background:#f0fff4;border:1px dashed #25D366;padding:10px;border-radius:10px;margin-top:10px"><b>Pay to - TUMHARA NAAM</b><br><span style="color:#555">UPI ID - tumhara@upi</span></div>
<p><b>Total: ₹<span id="payTotal">0</span></b></p>
<button class="payBtn" onclick="orderOnWhatsApp()">📲 WhatsApp par Order Bhejo</button><br><br>
<button onclick="document.getElementById('payBox').style.display='none'" style="background:#ddd;padding:8px 15px;border:0;border-radius:8px">Band Karo</button>
</div>
<script>
let products = JSON.parse(localStorage.getItem('myShopProducts') || '[]');
let cart = [];
if(products.length===0){ products=[{name:'Demo Product',mrp:999,price:499,discount:50,img:'https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=400',desc:'Best Quality'}]; }
function render(){
  let h='';
  products.forEach((p,i)=>{
    let mrp=p.mrp||p.price; let disc=p.discount!==undefined?p.discount:Math.round((mrp-p.price)/mrp*100);
    h+=`<div class="card"><span class="badge">${disc}% off</span><img src="${p.img}"><b>${p.name}</b><br><small>${p.desc}</small><br><span class="price">₹${p.price}</span> <span class="mrp">₹${mrp}</span> <span class="off">${disc}% off</span><br><small style="color:#388e3c">Free Delivery</small><button onclick="addToCart(${i})">Add to Cart</button></div>`;
  });
  document.getElementById('products').innerHTML=h;
}
function addToCart(i){ cart.push(products[i]); document.getElementById('cartCount').innerText=cart.length; alert('Cart me add ho gaya!'); }
function showCart(){ document.getElementById('cartBox').style.display='block'; let h=''; let total=0, save=0; cart.forEach(p=>{ let mrp=p.mrp||p.price; h+=`${p.name} - ₹${p.price} <s>₹${mrp}</s><br>`; total+=p.price; save+=(mrp-p.price); }); document.getElementById('cartList').innerHTML=h||'Cart khali hai'; document.getElementById('total').innerText=total; document.getElementById('saving').innerText= save>0 ? '🎉 Tumne Total ₹'+save+' bachaye!' : ''; }
function showPay(){ if(cart.length===0){ alert('Pehle Cart me product add karo'); return; } let total=0; cart.forEach(p=>total+=p.price); document.getElementById('payTotal').innerText=total; document.getElementById('payBox').style.display='block'; document.getElementById('payBox').scrollIntoView({behavior:'smooth'}); }
function orderOnWhatsApp(){ let total=0, save=0, msg='Mujhe ye order chahiye:%0A'; cart.forEach(p=>{ let mrp=p.mrp||p.price; msg+=`- ${p.name} - Rs.${p.price} (MRP Rs.${mrp})%0A`; total+=p.price; save+=(mrp-p.price); }); msg+=`Total: Rs.${total}%0A Bachat: Rs.${save}%0A Maine QR se payment kar diya hai.`; window.open('https://wa.me/919999999999?text='+msg,'_blank'); }
render();
</script>
</body>
</html>
